name: "Profile unknown dataset"
category: eda
description: |
  Given a dataset the agent has never seen, it must load it, profile it,
  and report key findings (shape, types, outliers, patterns).
dataset: timeseries_sensor.csv
surface: mcp

task_prompt: |
  Load the timeseries_sensor.csv file and perform exploratory data analysis:
  1. Load and inspect the data to understand its structure
  2. Profile the dataset to identify statistical properties
  3. Identify any outliers or anomalous values in the numeric columns
  4. Report your findings: how many rows, columns, any data quality issues?

  Focus on identifying problematic values that might be sensor errors.

expectations:
  assertions:
    - type: row_count
      value: 48
    - type: columns_exist
      columns:
        [
          "sensor_id",
          "timestamp",
          "temperature",
          "humidity",
          "pressure",
          "battery_pct",
        ]

  scoring:
    - metric: completeness
      description: "Did the agent inspect, profile, and identify outliers?"
      weight: 0.5
    - metric: correctness
      description: "Did the agent identify the 99.9°C and -40.0°C outliers?"
      weight: 0.5

max_turns: 15
timeout_s: 90
models:
  - claude-sonnet-4-20250514
